name: CI

# Offline checks only: no DSH host, no registry, no credentials.
# The two runtime scripts are plain ESM, so `node --check` catches syntax
# breakage without loading the host. The render suite needs a real profile and
# is intentionally kept local (see README -> 开发).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Syntax + package contents (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check both runtime scripts
        run: |
          node --check lib/index.js
          node --check lib/client.js

      - name: Parse manifests
        run: |
          node --input-type=module -e "import fs from 'node:fs'; for (const f of ['package.json','CHANGELOG.md']) { if (f.endsWith('.json')) JSON.parse(fs.readFileSync(f,'utf8')); else if (!fs.readFileSync(f,'utf8').includes('v0.1.0')) throw new Error('changelog missing'); console.log('OK', f) }"

      - name: Verify the published tarball contents
        run: |
          npm pack --dry-run --json > pack.json
          node --input-type=module -e "import fs from 'node:fs'; const j=JSON.parse(fs.readFileSync('pack.json','utf8'))[0]; const names=j.files.map(f=>f.path); for (const f of ['lib/index.js','lib/client.js','cordis.patch.yml','README.md','CHANGELOG.md','LICENSE']) { if (!names.includes(f)) { console.error('MISSING from tarball:', f); process.exit(1) } console.log('packed:', f) } console.log('version', j.version, '| files', names.length)"
